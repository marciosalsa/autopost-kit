# Settings for the "steam_releases" topic.
# Every value can be overridden from the command line or, later, a user config file.

# Steam's store calendar follows Pacific time, so "tomorrow" is computed there.
timezone: America/Los_Angeles
days_ahead: 1

# Store region and language used for names, dates and prices.
country: us
store_language: english

# Only full games: leaves out soundtracks, demos and DLC listed for the same day.
only_games: true

# Steam content descriptor ids to leave out of posts:
#   1 = some nudity or sexual content   2 = frequent violence or gore
#   3 = adult only sexual content       4 = frequent nudity or sexual content
#   5 = general mature content
excluded_content_descriptors: [3, 4]

# What goes into the post: the N most popular games, countdown style.
top_n: 5

# Games whose title contains any of these words (whole word, any case) are
# never posted; the next most popular game takes their place.
blocked_words:
  - abuse
  - rape
  - porn
  - hentai
  - sex
  - sexy
  - nsfw
  - nazi
  - hitler
  - genocide
  - terrorist
  - great again
  - election
  - president

# Post language (a file in locales/) and hashtags for the caption.
language: en
hashtags: "#steam #newgames #pcgaming #gaming #indiegames #upcominggames"

# Reel: seconds wanted per scene. With librosa installed, they are rounded
# to whole bars of the song so every cut lands on the beat.
reel:
  cover_seconds: 3.7
  clip_seconds: 11

# Visual identity of the channel (colors as hex, size in pixels).
theme:
  width: 1080
  height: 1350
  margin: 64
  background: "#0d1117"
  accent: "#7cf2c7"
  text: "#f2f5f9"
  muted: "#9aa7b6"
  divider: "#232a33"
  on_accent: "#06120d"

# Safety limits for scanning the store.
max_search_pages: 40        # Steam returns 25-100 games per page
popularity_pages: 12        # pages of "popular upcoming" used to rank games
request_interval_seconds: 1.5
