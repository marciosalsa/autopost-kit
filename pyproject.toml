[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autopost-kit"
version = "0.1.0"
description = "A pluggable engine that turns public data into Instagram carousels."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Marcio Salsa" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
    "boto3>=1.34",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
music = ["librosa>=0.10"]

[project.scripts]
autopost-kit = "autopost_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"autopost_kit.topics.steam_releases" = ["topic.yaml", "locales/*.yaml"]
"autopost_kit.assets.fonts" = ["*.ttf", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
